apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-k8s-gitops-flux-sops-workshop
  labels:
    app.kubernetes.io/name: spring-boot-k8s-gitops-flux-sops-workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spring-boot-k8s-gitops-flux-sops-workshop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spring-boot-k8s-gitops-flux-sops-workshop
    spec:
      containers:
        - name: spring-boot-k8s-gitops-flux-sops-workshop
          image: spring-boot-k8s-gitops-flux-sops-workshop:must-be-set-by-overlay
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/config/"
            - name: DEMO_TOKEN1
              valueFrom:
                secretKeyRef:
                  name: spring-boot-k8s-gitops-flux-sops-workshop-secrets
                  key: demo-token1
            - name: DEMO_TOKEN2
              valueFrom:
                secretKeyRef:
                  name: spring-boot-k8s-gitops-flux-sops-workshop-secrets
                  key: demo-token2
          volumeMounts:
            - name: application-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: application-config
          configMap:
            name: spring-boot-k8s-gitops-flux-sops-workshop-config
